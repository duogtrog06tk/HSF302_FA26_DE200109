spring.application.name=SE20B01_DE200109_SDM_FE

server.port=8080

# ===== SQL Server =====
# encrypt=true là mặc định của mssql-jdbc → cần trustServerCertificate=true khi chạy local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF302_2026_PE_SDM;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# update: tự tạo/cập nhật bảng theo entity, giữ nguyên dữ liệu
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

